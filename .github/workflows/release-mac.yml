name: Release Mac app

# The one release definition for mz's Mac apps. An app calls it from its own
# .github/workflows/release.yml (see docs/releasing.md for the caller).
#
# It builds a universal app, signs it with Developer ID, notarizes and
# staples it, zips it, signs the zip with the app's Sparkle EdDSA key, writes
# appcast.xml, and publishes all of it as one GitHub Release. The release
# notes are the app's CHANGELOG.md section for the version.
#
# The app's Sparkle feed is the appcast on its latest release:
#   https://github.com/<owner>/<repo>/releases/latest/download/appcast.xml
#
# Order is the fail-safe: nothing is published until every check has passed,
# so a red run leaves the feed on the last version that exists.

on:
  workflow_call:
    inputs:
      app-name:
        description: Product name, e.g. Tessellate. Also the scheme and the zip name.
        required: true
        type: string
      scheme:
        description: Xcode scheme. Default is app-name.
        type: string
        default: ""
      project:
        description: Xcode project. Default is <app-name>.xcodeproj.
        type: string
        default: ""
      runner:
        type: string
        default: macos-26
      siblings:
        description: Repos to check out next to the app (path dependencies), space-separated, e.g. "michellzappa/housekit".
        type: string
        default: ""
      submodules:
        type: boolean
        default: false
      xcodegen:
        description: Run xcodegen generate before building.
        type: boolean
        default: true
      build-number-command:
        description: Prints CFBundleVersion. Sparkle compares this number, so it must grow with every release.
        type: string
        default: git rev-list --count HEAD
      xcodebuild-args:
        description: Extra build settings, e.g. CARGO_COMMIT=abc.
        type: string
        default: ""
      verify-command:
        description: Extra checks on the signed app. APP_PATH points at it.
        type: string
        default: ""
      publish:
        description: Create the tag, the GitHub Release and the appcast. False builds and checks only.
        type: boolean
        default: true
    secrets:
      APPLE_TEAM_ID:
        required: true
      APPLE_DEVELOPER_CERTIFICATE_P12_BASE64:
        required: true
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER_ID:
        required: true
      APPLE_API_PRIVATE_KEY_BASE64:
        required: true
      SPARKLE_PRIVATE_ED_KEY:
        required: true

env:
  # Sparkle's command line tools (sign_update). Pinned by version and hash.
  SPARKLE_VERSION: "2.10.1"
  SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      APP_NAME: ${{ inputs.app-name }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Check out the app (full history for the build number)
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Check out path dependencies
        working-directory: .
        env:
          SIBLINGS: ${{ inputs.siblings }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for repo in $SIBLINGS; do
            git clone --quiet --depth 1 "https://github.com/$repo.git" "$(basename "$repo")"
          done

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        if: inputs.xcodegen
        run: |
          brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 20)
          printf '%s' "$P12" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          rm -f "$certificate"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Archive the universal app
        env:
          SCHEME: ${{ inputs.scheme }}
          PROJECT: ${{ inputs.project }}
          BUILD_NUMBER_COMMAND: ${{ inputs.build-number-command }}
          EXTRA_ARGS: ${{ inputs.xcodebuild-args }}
        run: |
          set -euo pipefail
          scheme="${SCHEME:-$APP_NAME}"
          project="${PROJECT:-$APP_NAME.xcodeproj}"
          build=$(eval "$BUILD_NUMBER_COMMAND" | head -1)
          [[ "$build" =~ ^[0-9]+$ ]] || { echo "::error::Build number '$build' is not a number"; exit 1; }
          archive="$RUNNER_TEMP/$APP_NAME.xcarchive"
          # shellcheck disable=SC2086
          xcodebuild \
            -project "$project" \
            -scheme "$scheme" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$archive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            $EXTRA_ARGS \
            archive
          app="$archive/Products/Applications/$APP_NAME.app"
          [[ -d "$app" ]] || { echo "::error::$app not found"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Sign Sparkle's helpers with Developer ID
        # Sparkle.framework carries XPC services and helper apps. Notarization
        # needs each one signed with our identity, hardened runtime and a
        # timestamp: innermost first, then the framework, then the app.
        run: |
          set -euo pipefail
          sparkle="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          [[ -d "$sparkle" ]] || { echo "::error::$APP_NAME.app does not embed Sparkle.framework, so it can never update itself"; exit 1; }
          # --preserve-metadata keeps the Downloader service's own sandbox
          # entitlements, which sandboxed apps need.
          sign() { codesign --force --options runtime --timestamp --preserve-metadata=entitlements --sign "$SIGN_IDENTITY" "$1"; }
          while IFS= read -r bundle; do
            sign "$bundle"
          done < <(find "$sparkle/Versions" \( -name '*.xpc' -o -name '*.app' \) -type d -prune -print | sort -r)
          if [[ -f "$sparkle/Versions/B/Autoupdate" ]]; then sign "$sparkle/Versions/B/Autoupdate"; fi
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$sparkle"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" \
            --preserve-metadata=entitlements,requirements,flags "$APP_PATH"

      - name: Check the app
        run: |
          set -euo pipefail
          plist="$APP_PATH/Contents/Info.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2>/dev/null || true; }
          version=$(read_key CFBundleShortVersionString)
          build=$(read_key CFBundleVersion)
          [[ -n "$version" ]] || { echo "::error::No CFBundleShortVersionString"; exit 1; }
          [[ "$build" =~ ^[0-9]+$ ]] || { echo "::error::CFBundleVersion '$build' is not a number. Set it to \$(CURRENT_PROJECT_VERSION)."; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi
          # A release without these keys can never hear about the next one.
          feed=$(read_key SUFeedURL)
          public_key=$(read_key SUPublicEDKey)
          [[ "$feed" == "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" ]] \
            || { echo "::error::SUFeedURL is '$feed', expected this repo's latest-release appcast"; exit 1; }
          [[ "$(printf '%s' "$public_key" | base64 --decode 2>/dev/null | wc -c | tr -d ' ')" == 32 ]] \
            || { echo "::error::SUPublicEDKey is missing or not a 32-byte Ed25519 key"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          {
            echo "APP_VERSION=$version"
            echo "APP_BUILD=$build"
            echo "MIN_MACOS=$(read_key LSMinimumSystemVersion)"
            echo "PUBLIC_KEY=$public_key"
          } >> "$GITHUB_ENV"

      - name: Extra checks from the app
        if: inputs.verify-command != ''
        env:
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: eval "$VERIFY_COMMAND"

      - name: Release notes from CHANGELOG.md
        # No section, no release: the notes are what users read in Sparkle's
        # window and on the GitHub Release.
        run: |
          set -euo pipefail
          [[ -f CHANGELOG.md ]] || { echo "::error::No CHANGELOG.md"; exit 1; }
          awk -v v="$APP_VERSION" '
            /^## / {
              if (found) exit
              h = $0; sub(/^## +\[?/, "", h); split(h, a, /[] ]/)
              if (a[1] == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [[ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]]; then
            echo "::error::CHANGELOG.md has no '## $APP_VERSION' section (or it is empty)"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Refuse a version that is already released
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$APP_VERSION" >/dev/null 2>&1; then
            echo "::error::v$APP_VERSION is already released. Bump the version."
            exit 1
          fi

      - name: Notarize and staple
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/$APP_NAME-notarization.zip"
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$zip"
          printf '%s' "$API_KEY" | base64 --decode > "$key"
          xcrun notarytool submit "$zip" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait --timeout 1h \
            | tee "$RUNNER_TEMP/notarize.log"
          rm -f "$key"
          grep -q "status: Accepted" "$RUNNER_TEMP/notarize.log" || { echo "::error::Notarization was not accepted"; exit 1; }
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"

      - name: Package
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          zip_name="$APP_NAME-$APP_VERSION.zip"
          mkdir -p "$out"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$out/$zip_name"
          (cd "$out" && shasum -a 256 "$zip_name" > SHA256SUMS)
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/${{ env.ZIP_NAME }}

      - name: Sign the update and write appcast.xml
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          zip="$out/$ZIP_NAME"
          [[ -n "$SPARKLE_PRIVATE_ED_KEY" ]] || { echo "::error::SPARKLE_PRIVATE_ED_KEY is not set"; exit 1; }

          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o "$tools/sparkle.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$tools/sparkle.tar.xz" -C "$tools" ./bin/sign_update

          signed=$(printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$tools/bin/sign_update" --ed-key-file - "$zip")
          signature=$(printf '%s' "$signed" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          length=$(stat -f %z "$zip")
          [[ -n "$signature" ]] || { echo "::error::sign_update gave no signature"; exit 1; }

          # The private key must match the public key compiled into this
          # build. A mismatch ships an update every copy rejects.
          cat > "$tools/verify.swift" <<'SWIFT'
          import CryptoKit
          import Foundation
          let a = CommandLine.arguments
          guard let key = Data(base64Encoded: a[1]), let sig = Data(base64Encoded: a[2]),
                let data = FileManager.default.contents(atPath: a[3]),
                let pub = try? Curve25519.Signing.PublicKey(rawRepresentation: key),
                pub.isValidSignature(sig, for: data) else { print("invalid"); exit(1) }
          print("valid")
          SWIFT
          swift "$tools/verify.swift" "$PUBLIC_KEY" "$signature" "$zip" \
            || { echo "::error::SPARKLE_PRIVATE_ED_KEY does not match SUPublicEDKey in the app"; exit 1; }

          notes_html=$(gh api markdown -F text=@"$RUNNER_TEMP/notes.md" -f mode=gfm -f context="$GITHUB_REPOSITORY")
          notes_html=${notes_html//]]>/]]]]><![CDATA[>}
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$APP_VERSION/$ZIP_NAME"
          min_line=""
          [[ -n "$MIN_MACOS" ]] && min_line="      <sparkle:minimumSystemVersion>$MIN_MACOS</sparkle:minimumSystemVersion>"
          cat > "$out/appcast.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>$APP_NAME</title>
              <link>https://github.com/$GITHUB_REPOSITORY</link>
              <item>
                <title>$APP_NAME $APP_VERSION</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$APP_BUILD</sparkle:version>
                <sparkle:shortVersionString>$APP_VERSION</sparkle:shortVersionString>
          $min_line
                <description><![CDATA[$notes_html]]></description>
                <enclosure url="$url" length="$length" type="application/octet-stream" sparkle:edSignature="$signature"/>
              </item>
            </channel>
          </rss>
          XML
          sed -i '' -e '/^[[:space:]]*$/d' "$out/appcast.xml"
          xmllint --noout "$out/appcast.xml"
          cat "$out/appcast.xml"

      - name: Keep the build for a run that does not publish
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-name }}-release
          path: ${{ runner.temp }}/release
          retention-days: 7

      - name: Publish the GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cp "$RUNNER_TEMP/notes.md" "$notes"
          printf '\n## Verify the download\n\n```\nshasum -a 256 -c SHA256SUMS\ngh attestation verify %s -R %s\n```\n' "$ZIP_NAME" "$GITHUB_REPOSITORY" >> "$notes"
          gh release create "v$APP_VERSION" \
            "$RUNNER_TEMP/release/$ZIP_NAME" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release/appcast.xml" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $APP_VERSION" \
            --notes-file "$notes" \
            --latest
